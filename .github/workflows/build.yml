name: build-llama-cpp-python-aarch64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # GitHub 官方的 arm64 原生 runner（公开仓库免费）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          lscpu | grep -E "Model name|Architecture" || true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Build wheel
        env:
          # 关键：关掉 -march=native，锁定 armv8-a 基线
          # 目标机是骁龙625（Cortex-A53），不能用 armv8.2 指令，否则非法指令崩溃
          CMAKE_ARGS: >-
            -DGGML_NATIVE=OFF
            -DGGML_OPENMP=ON
            -DGGML_CPU_ARM_ARCH=armv8-a
            -DCMAKE_BUILD_PARALLEL_LEVEL=4
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel llama-cpp-python==0.3.36 --no-deps -w dist

      - name: Verify wheel arch
        run: |
          ls -lh dist/
          python - <<'PY'
          import zipfile, glob, re
          for w in glob.glob("dist/*.whl"):
              print("wheel:", w)
              with zipfile.ZipFile(w) as z:
                  names = z.namelist()
                  libs = [n for n in names if n.endswith(".so")]
                  print("  shared libs:", libs[:5])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-wheel-aarch64-py313
          path: dist/*.whl
          retention-days: 7
